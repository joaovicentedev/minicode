[project]
name = "minicode"
version = "0.1.0"
description = "Agente de programação com LLM e harness verificável"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27.0,<1.0.0",
    "openai>=1.68.0,<2.0.0",
    "pydantic>=2.10.6,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.scripts]
minicode = "minicode.cli:main"
minicode-eval = "minicode.evaluation:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9.0.0",
    "ruff>=0.11.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minicode"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
